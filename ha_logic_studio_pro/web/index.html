<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HA Logic Studio Pro</title>
  <link rel="stylesheet" href="./pro.css">
</head>
<body>
  <main id="studio-layout">
    <aside id="project-sidebar" aria-label="Projekte">
      <header id="project-header">
        <div id="project-actions"></div>
        <div id="project-languages" role="group" aria-label="Sprache"></div>
        <div id="project-view-actions"></div>
        <div id="project-menu" hidden>
          <button id="open-yaml" type="button">YAML-Datei öffnen</button>
          <button id="download-project-draft" type="button">Projektbaum herunterladen</button>
          <input id="yaml-file" type="file" accept=".yaml,.yml,text/yaml" hidden>
        </div>
      </header>
      <input id="project-search" type="search" aria-label="Projekte suchen" placeholder="Projekte suchen …" hidden>
      <nav id="projects"></nav>
      <p id="project-message" role="status" hidden></p>
      <footer id="project-filters" role="group" aria-label="Projektliste filtern"></footer>
    </aside>
    <div id="project-splitter" role="separator" aria-label="Breite der Projektliste"
         aria-controls="project-sidebar" aria-orientation="vertical" tabindex="0"></div>
    <section class="work-area">
      <header class="top">
        <strong>HA Logic Studio Pro</strong>
        <span class="badge"><span id="pro-version"></span><span>Interner Test</span></span>
      </header>
      <nav id="tabs" aria-label="Geöffnete Projekte"></nav>
      <div id="editor-layout">
        <div id="editor"></div>
        <section id="protocol" aria-labelledby="protocol-title" hidden>
          <div id="protocol-tools">
            <a id="protocol-download" aria-label="Protokoll herunterladen" title="Protokoll herunterladen">↓</a>
            <button id="protocol-dock" type="button" aria-label="Protokoll rechts anordnen" title="Protokoll rechts anordnen"></button>
            <button id="protocol-hide" type="button" aria-label="Protokoll ausblenden" title="Protokoll ausblenden">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10 5a10 10 0 0 1 12 7 11 11 0 0 1-3 4M6 6a15 15 0 0 0-4 6s3 7 10 7a11 11 0 0 0 4-1m-6-8a3 3 0 0 0 4 4"/></svg>
            </button>
          </div>
          <div id="protocol-body">
            <h2 id="protocol-title">Protokoll</h2>
            <div id="protocol-lines" role="log" aria-labelledby="protocol-title"></div>
          </div>
        </section>
        <button id="protocol-show" type="button" aria-label="Protokoll anzeigen" title="Protokoll anzeigen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </section>
  </main>
  <dialog id="project-dialog">
    <form method="dialog">
      <h2>Neue Logik erstellen</h2>
      <div class="cards">
        <button value="rules"><span class="card-icon" aria-hidden="true">ϟ</span><strong>Regeln</strong><small>Wenn, dann, sonst</small></button>
        <button value="blocks"><span class="card-icon" aria-hidden="true"></span><strong>Blocks A</strong><small>HA-Automation als YAML</small></button>
        <button value="blocks-js"><span class="card-icon" aria-hidden="true"></span><strong>Blocks JS</strong><small>JavaScript im Studio testen</small></button>
        <button value="flow"><span class="card-icon" aria-hidden="true"></span><strong>Funktionsplan</strong><small>Bausteine verbinden</small></button>
        <button value="javascript"><span class="card-icon js-icon" aria-hidden="true">JS</span><strong>JavaScript</strong><small>Code schreiben und testen</small></button>
        <button value="typescript"><span class="card-icon ts-icon" aria-hidden="true">TS</span><strong>TypeScript</strong><small>Typisierten Code schreiben und testen</small></button>
        <button value="yaml"><span class="card-icon yaml-icon" aria-hidden="true">{ }</span><strong>HA-YAML</strong><small>Skripte und Automationen</small></button>
      </div>
      <button value="cancel">Schließen</button>
    </form>
  </dialog>
  <dialog id="folder-dialog" aria-labelledby="folder-title">
    <form method="dialog" class="project-details">
      <h2 id="folder-title">Neuen Ordner erstellen</h2>
      <label for="folder-name">Name</label>
      <input id="folder-name" maxlength="100" required>
      <div class="project-details-actions">
        <button value="create">Erstellen</button>
        <button value="cancel" formnovalidate>Abbrechen</button>
      </div>
    </form>
  </dialog>
  <dialog id="project-details-dialog" aria-labelledby="project-details-title">
    <form method="dialog" class="project-details">
      <h2 id="project-details-title">Neues Skript erstellen</h2>
      <label for="project-name">Name</label>
      <input id="project-name" maxlength="100" required autofocus>
      <label for="project-folder">Ordner</label>
      <select id="project-folder">
        <option value="">Hauptordner</option>
        <option value="common">Allgemeine Skripte (common)</option>
        <option value="global">Globale Skripte (global)</option>
      </select>
      <label for="project-id-preview">ID</label>
      <input id="project-id-preview" readonly>
      <div class="project-details-actions">
        <button value="create">Erstellen</button>
        <button value="cancel" formnovalidate>Abbrechen</button>
      </div>
    </form>
  </dialog>
  <dialog id="yaml-dialog">
    <form method="dialog">
      <h2 id="yaml-title">HA-YAML erstellen</h2>
      <label for="yaml-kind">Typ</label>
      <select id="yaml-kind">
        <option value="script">HA-Skript</option>
        <option value="automation">HA-Automation</option>
      </select>
      <button value="cancel">Abbrechen</button>
      <button value="confirm">Öffnen</button>
    </form>
  </dialog>
  <script type="module" src="./pro.js?v=0.1.68"></script>
</body>
</html>
