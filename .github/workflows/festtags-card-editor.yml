name: Festtags-Card-Editor checks
on:
  push:
    paths: [festtags_card_editor/**, .github/workflows/festtags-card-editor.yml]
  pull_request:
    paths: [festtags_card_editor/**, .github/workflows/festtags-card-editor.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: festtags_card_editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: npm run check
      - run: npm test
      - run: python tools/build.py
      - run: docker build -t ugso-festtags-card-editor:test .
