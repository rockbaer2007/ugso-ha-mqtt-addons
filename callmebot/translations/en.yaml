configuration:
  mqtt:
    name: MQTT broker
    description: Internal HA broker remains default; external broker and verified TLS are optional.
    fields:
      use_supervisor:
        name: Use HA broker automatically
      tls:
        name: Enable TLS
      ca:
        name: Custom CA (PEM)
      cert:
        name: Client certificate (PEM)
      key:
        name: Private client key (PEM)
      host:
        name: Broker address
      port:
        name: Port
      username:
        name: Username
      password:
        name: Password
