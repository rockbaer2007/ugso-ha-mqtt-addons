configuration:
  mqtt:
    name: MQTT-Broker
    description: Interner HA-Broker bleibt Standard; externe Verbindung und geprüftes TLS sind optional.
    fields:
      use_supervisor:
        name: HA-Broker automatisch verwenden
      tls:
        name: TLS aktivieren
      ca:
        name: Eigene CA (PEM)
      cert:
        name: Client-Zertifikat (PEM)
      key:
        name: Privater Client-Schlüssel (PEM)
      host:
        name: Broker-Adresse
      port:
        name: Port
      username:
        name: Benutzername
      password:
        name: Passwort
