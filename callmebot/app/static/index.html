<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UGSo CallMeBot</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head>
<body><header><strong class="brand"><img src="./icon.svg" width="36" height="36" alt="">UGSo CallMeBot <small>0.1.3</small></strong><div class="preferences"><label><span data-t="language"></span><select id="language"><option value="system">System</option><option value="de">Deutsch</option><option value="en">English</option><option value="fr">Français</option></select></label><label><span data-t="appearance"></span><select id="appearance"><option value="system" data-t="system"></option><option value="light" data-t="light"></option><option value="dark" data-t="dark"></option></select></label></div></header>
<main><div class="heading"><div><h1 data-t="heading"></h1><p data-t="subtitle"></p></div><span id="connection" role="status"></span></div>
<div class="grid"><section><h2 data-t="profiles"></h2><label><span data-t="choose"></span><select id="profiles"></select></label><form id="profile-form"><div class="two"><label><span data-t="id"></span><input id="id" maxlength="40" pattern="[a-z][a-z0-9_]{0,39}" required autocomplete="off"></label><label><span data-t="name"></span><input id="name" maxlength="80" required autocomplete="off"></label></div><label><span data-t="phone"></span><input id="phone" type="tel" placeholder="+49123456789" pattern="\+[1-9][0-9]{6,14}" required autocomplete="off"></label><label><span data-t="key"></span><input id="key" type="password" maxlength="200" autocomplete="new-password"></label><p class="hint" data-t="key_hint"></p><label class="check"><input id="default" type="checkbox"><span data-t="default"></span></label><div class="buttons"><button class="primary" type="submit" data-t="save"></button><button id="new" type="button" data-t="new"></button><button id="delete" type="button" data-t="delete"></button></div></form></section>
<section><h2 data-t="test"></h2><label><span data-t="message"></span><textarea id="message" maxlength="4000" rows="4"></textarea></label><p class="hint" data-t="test_hint"></p><div class="buttons"><button id="send" class="primary" data-t="send"></button><button id="refresh" data-t="refresh"></button></div><h3 data-t="recent"></h3><ul id="recent"></ul><p class="hint" data-t="accepted_hint"></p></section></div>
<p id="notice" role="status" aria-live="polite"></p><section><h2 data-t="setup"></h2><ol><li data-t="step1"></li><li><span data-t="step2"></span> <code>I allow callmebot to send me messages</code></li><li data-t="step3"></li></ol><p><a href="https://www.callmebot.com/blog/free-api-whatsapp-messages/" target="_blank" rel="noopener noreferrer" data-t="guide"></a></p><p class="hint" data-t="limits"></p></section>
<section><h2 data-t="blocks"></h2><p data-t="blocks_hint"></p><code>ugso/callmebot/send</code><p class="hint" data-t="mqtt_hint"></p><a id="docs" href="https://opensource.ugso-software.de/projects/callmebot/" target="_blank" rel="noopener noreferrer" data-t="docs"></a></section><footer data-t="footer"></footer></main><script src="./app.js" type="module"></script></body></html>
