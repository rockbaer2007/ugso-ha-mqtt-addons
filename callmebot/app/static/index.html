<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CallMeBot Whatsapp</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./admin.css"></head>
<body><header><strong class="brand"><img src="./icon.svg" width="36" height="36" alt="">CallMeBot Whatsapp <small>0.1.6 · <span data-t="beta"></span></small></strong><div class="preferences"><label><span data-t="language"></span><select id="language"><option value="system">System</option><option value="de">Deutsch</option><option value="en">English</option><option value="fr">Français</option></select></label><label><span data-t="appearance"></span><select id="appearance"><option value="system" data-t="system"></option><option value="light" data-t="light"></option><option value="dark" data-t="dark"></option></select></label></div></header>
<main><div class="heading"><div><h1 data-t="heading"></h1><p data-t="subtitle"></p></div><span id="connection" role="status"></span></div>
<div class="grid"><section><h2 data-t="profiles"></h2><label><span data-t="choose"></span><select id="profiles"></select></label><form id="profile-form"><div class="two"><label><span data-t="id"></span><input id="id" maxlength="40" pattern="[a-z][a-z0-9_]{0,39}" required autocomplete="off"></label><label><span data-t="name"></span><input id="name" maxlength="80" required autocomplete="off"></label></div><label><span data-t="phone"></span><input id="phone" type="tel" placeholder="+49123456789" pattern="\+[1-9][0-9]{6,14}" required autocomplete="off"></label><label><span data-t="key"></span><input id="key" type="password" maxlength="200" autocomplete="new-password"></label><p class="hint" data-t="key_hint"></p><label class="check"><input id="default" type="checkbox"><span data-t="default"></span></label><div class="buttons"><button class="primary" type="submit" data-t="save"></button><button id="new" type="button" data-t="new"></button><button id="delete" type="button" data-t="delete"></button></div></form></section>
<section><h2 data-t="test"></h2><label><span data-t="message"></span><textarea id="message" maxlength="4000" rows="4"></textarea></label><p class="hint" data-t="test_hint"></p><div class="buttons"><button id="send" class="primary" data-t="send"></button><button id="refresh" data-t="refresh"></button></div><h3 data-t="recent"></h3><p class="hint" data-t="history_hint"></p><div class="two"><label><span data-t="history_filter"></span><select id="history-profile"></select></label><label><span data-t="history_status"></span><select id="history-status"><option value="" data-t="all"></option><option value="errors" data-t="errors"></option><option value="accepted" data-t="accepted"></option><option value="queued" data-t="queued"></option></select></label></div><p id="history-warning" role="status"></p><button id="history-clear" data-t="history_clear"></button><ul id="recent"></ul><p class="hint" data-t="accepted_hint"></p></section></div>
<p id="notice" role="status" aria-live="polite"></p><section><h2 data-t="setup"></h2><ol><li data-t="step1"></li><li><span data-t="step2"></span> <code>I allow callmebot to send me messages</code></li><li data-t="step3"></li></ol><p><a href="https://www.callmebot.com/blog/free-api-whatsapp-messages/" target="_blank" rel="noopener noreferrer" data-t="guide"></a></p><p class="hint" data-t="limits"></p></section>
<section><h2 data-t="blocks"></h2><p data-t="blocks_hint"></p><code>ugso/callmebot/send</code><p class="hint" data-t="mqtt_hint"></p><a id="docs" href="https://opensource.ugso-software.de/projects/callmebot/" target="_blank" rel="noopener noreferrer" data-t="docs"></a></section><section><h2 data-t="backup"></h2><p class="hint" data-t="backup_hint"></p><label><span data-t="backup_password_label"></span><input id="backup-password" type="password" minlength="12" maxlength="1024" autocomplete="new-password"></label><div class="buttons"><button id="backup-export" data-t="backup_export"></button><button id="backup-restore" data-t="backup_restore"></button></div><input id="backup-file" type="file" accept=".json" hidden></section>
<section><details><summary data-t="mqtt_settings"></summary><p id="mqtt-warning" role="status"></p><form id="mqtt-form"><label class="check"><input id="mqtt-auto" type="checkbox"><span data-t="mqtt_auto"></span></label><div class="two"><label><span data-t="mqtt_host"></span><input id="mqtt-host" required></label><label><span data-t="mqtt_port"></span><input id="mqtt-port" type="number" min="1" max="65535" required></label></div><label><span data-t="mqtt_user"></span><input id="mqtt-username" autocomplete="username"></label><label><span data-t="mqtt_password"></span><input id="mqtt-password" type="password" autocomplete="new-password"></label><label class="check"><input id="mqtt-tls" type="checkbox"><span data-t="mqtt_tls"></span></label><p class="hint" data-t="tls_hint"></p><label><span data-t="ca"></span><textarea id="mqtt-ca" rows="3" maxlength="65536" autocomplete="off"></textarea><input type="file" data-pem="mqtt-ca" accept=".pem,.crt,.key"></label><label><span data-t="cert"></span><textarea id="mqtt-cert" rows="3" maxlength="65536" autocomplete="off"></textarea><input type="file" data-pem="mqtt-cert" accept=".pem,.crt,.key"></label><label><span data-t="private_key"></span><textarea id="mqtt-key" rows="3" maxlength="65536" autocomplete="off"></textarea><input type="file" data-pem="mqtt-key" accept=".pem,.crt,.key"></label><p id="tls-stored" class="hint"></p><label class="check"><input id="mqtt-clear" type="checkbox"><span data-t="tls_clear"></span></label><button id="mqtt-save" type="submit" data-t="save"></button></form></details></section><footer data-t="footer"></footer></main><script src="./app.js" type="module"></script></body></html>
