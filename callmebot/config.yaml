name: UGSo CallMeBot
version: "0.1.2"
slug: callmebot
description: WhatsApp-Textnachrichten über CallMeBot mit Empfängerprofilen und MQTT
stage: experimental
url: https://opensource.ugso-software.de/projects/callmebot/
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:message-text-outline
panel_title: CallMeBot
services: [mqtt:need]
options:
  mqtt:
    host: core-mosquitto
    port: 1883
    username: ""
    password: ""
schema:
  mqtt:
    host: str
    port: port
    username: str
    password: password
